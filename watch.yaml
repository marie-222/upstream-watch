# 監視対象の一覧。毎朝のクラウド routine が raw.githubusercontent.com 経由でこのファイルを読む。
#
# 項目:
#   name        表示名
#   source      版を読むファイルの raw URL（raw.githubusercontent.com だけが使える）
#   pattern     source の中から版と日付を取る正規表現（1行ずつ照合。グループ1=版、グループ2=公開日。日付が取れない source は
#               グループ1だけでよく、その場合は日付なしで通知する。複数行に当たるときは、最も新しい版を見る）
#   skip        見出しにこの文字列が含まれる行は未リリースとして無視する
#   have        自分がパッケージ（導入）済みの版。これより新しい版が出たら通知する
#   notes       通知に添えて見てほしい点（読む対象の raw URL や、前の版との比較の観点）
#
# have を上げるのは、新しい版をパッケージし終えたとき。上げ忘れると同じ通知が毎朝来る。

watch:
  - name: kitty
    source: https://raw.githubusercontent.com/kovidgoyal/kitty/master/docs/changelog.rst
    pattern: '^(\d+\.\d+\.\d+) \[(\d{4}-\d{2}-\d{2})\]'
    skip: '[future]'
    have: 0.50.0
    notes: >-
      Wayland、IME、Linux パッケージング、ビルド依存に関わる変更を拾う。
      https://raw.githubusercontent.com/kovidgoyal/kitty/v<latest>/bypy/sources.json の slang の版と、
      https://raw.githubusercontent.com/kovidgoyal/kitty/v<latest>/go.mod の go の版・toolchain を、
      have の版（v<have>）の同じファイルと比べて、変わっていれば明記する。
      参考: Ubuntu の slang-compiler は 2026.1.1 で、kitty 0.49.2 と 0.50.0 は slang 2026.14.1 を要求した。

  - name: rustls-ffi
    source: https://raw.githubusercontent.com/rustls/rustls-ffi/main/CHANGELOG.md
    pattern: '^## (\d+\.\d+\.\d+) \((\d{4}-\d{2}-\d{2})\)'
    have: 0.15.7
    notes: >-
      新しい版のセキュリティ節（### Security）と、C API の変更（追加・削除・名前の変更）を拾う。
      自前の rustls-ffi-quic（https://github.com/small-gear-lab/rustls-ffi-quic）は、この版の上に QUIC API を載せているので、
      新しい版が出たら downstream/update-upstream.sh <tag> で追従する。rustls_quic_* や rustls_client_connection_* に
      影響する変更、同梱の rustls クレートの版（Cargo.toml の rustls = "=x.y.z"）が上がったかを明記する。

  - name: curl
    source: https://ungh.cc/repos/curl/curl/releases/latest
    pattern: '"name":"(\d+\.\d+\.\d+)",.*?"publishedAt":"(\d{4}-\d{2}-\d{2})'
    have: 8.23.0
    notes: >-
      GitHub のリリースそのもの（ungh.cc が JSON で返す。github.com と api.github.com はクラウドからは読めない）。
      JSON の markdown フィールドはリンクと画像だけで、変更点は載っていない。リリースノートは
      https://raw.githubusercontent.com/curl/curl/curl-<版の . を _ にしたもの>/RELEASE-NOTES（例: curl-8_24_0）
      を読み、そこからセキュリティ修正（CVE）と、
      Rustls バックエンド（lib/vtls/rustls.c）・QUIC（lib/vquic/）・configure の変更を拾う。自前のパッチ 4 本
      （rustls-http3-ngtcp2-quic、rustls-capath、rustls-pinned-public-key、rustls-pinned-public-key-quic）が
      触るファイルなので、変更があれば明記する。ungh.cc は第三者のサービスで、止まったら取得失敗として通知する。
      curl は Ubuntu の debian/ の上にパッケージしている（packaging/curl）。Ubuntu 側の新しい curl の
      パッケージはクラウドからは読めない。

  - name: neovide
    source: https://ungh.cc/repos/neovide/neovide/releases/latest
    pattern: '"name":"(\d+\.\d+\.\d+)",.*?"publishedAt":"(\d{4}-\d{2}-\d{2})'
    have: 0.17.2
    notes: >-
      自前のパッチ版（https://github.com/small-gear-lab/apt-packaging の packaging/neovide/patches と winit-patches、
      docs/neovide-patched.md）が、新しい版にそのまま当たるか見る。パッチが触るのは src/window/wrapper/、
      src/window/application/、src/window/events.rs、src/bridge/（handler.rs、mod.rs、ui_commands.rs）、
      src/renderer/opengl.rs、src/renderer/box_drawing/renderer.rs、src/ipc/、src/main.rs、src/cmd_line.rs。
      これらの変更と、Cargo.toml の winit の版（0.17.2 は =0.30.13。変わると winit のパッチも作り直し）、
      macOS 専用だった --new-window / --reuse-instance などが Linux に入ったか（入ればパッチが不要になる）、
      ウィンドウを閉じるときの EGL の扱い（パッチ 0007）が変わったかを明記する。

  - name: neovim
    source: https://ungh.cc/repos/neovim/neovim/releases/latest
    pattern: '"name":"Nvim (\d+\.\d+\.\d+)",.*?"publishedAt":"(\d{4}-\d{2}-\d{2})'
    have: 0.12.6
    notes: >-
      自前の deb（https://github.com/small-gear-lab/apt-packaging の packaging/neovim。Ubuntu の neovim の debian/ を
      新しい upstream に載せ替えたもの、docs/neovim-build.md）がそのままビルドできるか見る。ビルド依存の版の要求
      （libuv、luajit、tree-sitter ほか）と、runtime の tree-sitter クエリが要求する文法の版、CMake のオプションの変更を拾う。
      設定（vim.pack、vim.lsp、tree-sitter、extmark、msgpack-rpc）に効く変更、Neovide の最低要求版が上がったか、
      nvim-treesitter（main）が要る tree-sitter-cli の版が変わったかも明記する。
